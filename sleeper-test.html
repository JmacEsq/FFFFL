<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFFFL Sleeper Test</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #03180f;
      color: #fff0cf;
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      color: #e86614;
    }

    .status {
      margin: 20px 0;
      padding: 15px;
      background: #0d3d25;
      border-radius: 8px;
      border: 1px solid #d4b45a;
    }

    .team {
      margin: 18px 0;
      padding: 20px;
      background: #0d3d25;
      border: 1px solid #d4b45a;
      border-radius: 8px;
    }

    .team h2 {
      margin: 0 0 8px;
      color: #e86614;
    }

    .record {
      margin-bottom: 15px;
    }

    .section-title {
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: bold;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: .8px;
      border-bottom: 1px solid rgba(255,255,255,.12);
      padding-bottom: 6px;
    }

    .player {
      display: grid;
      grid-template-columns: 50px 1fr 55px;
      gap: 10px;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .position {
      color: #e86614;
      font-weight: bold;
    }

    .team-abbr {
      color: #aaa;
      text-align: right;
    }

    .starter-row {
      background: rgba(212,180,90,.05);
    }
  </style>
</head>

<body>

  <h1>FFFFL Sleeper API Test</h1>

  <div class="status" id="status">
    Connecting to Sleeper...
  </div>

  <div id="teams"></div>

  <script>
    const LEAGUE_ID = "1312020664282025984";

    const POSITION_ORDER = {
      QB: 1,
      RB: 2,
      WR: 3,
      TE: 4,
      FLEX: 5,
      DEF: 6,
      K: 7
    };

    function getDisplayName(player) {
      return (
        player.full_name ||
        `${player.first_name || ""} ${player.last_name || ""}`.trim() ||
        "Unknown Player"
      );
    }

    function getPositionRank(position) {
      return POSITION_ORDER[position] || 99;
    }

    function sortPlayers(list) {
      return list.sort((a, b) => {
        const posDiff =
          getPositionRank(a.player.position) -
          getPositionRank(b.player.position);

        if (posDiff !== 0) {
          return posDiff;
        }

        return getDisplayName(a.player).localeCompare(
          getDisplayName(b.player)
        );
      });
    }

    function createPlayerRow(item, starter = false) {
      const player = item.player;

      const fullName = getDisplayName(player);
      const position = player.position || "—";
      const nflTeam = player.team || "FA";

      return `
        <div class="player ${starter ? "starter-row" : ""}">
          <span class="position">${position}</span>
          <span>${fullName}</span>
          <span class="team-abbr">${nflTeam}</span>
        </div>
      `;
    }

    async function loadSleeperData() {
      const status = document.getElementById("status");
      const teamsContainer = document.getElementById("teams");

      try {
        status.innerHTML = "Loading league data...";

        const [
          leagueResponse,
          usersResponse,
          rostersResponse,
          playersResponse
        ] = await Promise.all([
          fetch(`https://api.sleeper.app/v1/league/${LEAGUE_ID}`),
          fetch(`https://api.sleeper.app/v1/league/${LEAGUE_ID}/users`),
          fetch(`https://api.sleeper.app/v1/league/${LEAGUE_ID}/rosters`),
          fetch("https://api.sleeper.app/v1/players/nfl")
        ]);

        if (
          !leagueResponse.ok ||
          !usersResponse.ok ||
          !rostersResponse.ok ||
          !playersResponse.ok
        ) {
          throw new Error("Sleeper returned an error.");
        }

        const league = await leagueResponse.json();
        const users = await usersResponse.json();
        const rosters = await rostersResponse.json();
        const players = await playersResponse.json();

        const usersById = {};

        users.forEach(user => {
          usersById[user.user_id] = user;
        });

        status.innerHTML =
          `<strong>Connected successfully.</strong><br>
          League: ${league.name}<br>
          Rosters found: ${rosters.length}`;

        rosters.forEach(roster => {
          const owner = usersById[roster.owner_id];

          const ownerName =
            owner?.display_name ||
            "Unknown Owner";

          const teamName =
            owner?.metadata?.team_name ||
            ownerName;

          const wins = roster.settings?.wins ?? 0;
          const losses = roster.settings?.losses ?? 0;
          const ties = roster.settings?.ties ?? 0;

          const starterIds = roster.starters || [];
          const rosterIds = roster.players || [];

          const starters = [];
          const bench = [];

          rosterIds.forEach(playerId => {
            const player = players[playerId];

            if (!player) return;

            const item = {
              playerId,
              player
            };

            if (starterIds.includes(playerId)) {
              starters.push(item);
            } else {
              bench.push(item);
            }
          });

          sortPlayers(starters);
          sortPlayers(bench);

          const teamDiv = document.createElement("div");
          teamDiv.className = "team";

          let startersHTML = "";

          starters.forEach(item => {
            startersHTML += createPlayerRow(item, true);
          });

          let benchHTML = "";

          bench.forEach(item => {
            benchHTML += createPlayerRow(item, false);
          });

          teamDiv.innerHTML = `
            <h2>${teamName}</h2>

            <div>
              <strong>Owner:</strong>
              ${ownerName}
            </div>

            <div class="record">
              <strong>2026 Record:</strong>
              ${wins}-${losses}${ties ? `-${ties}` : ""}
            </div>

            <div class="section-title">
              Starting Lineup
            </div>

            ${startersHTML || "<div>No starters found.</div>"}

            <div class="section-title">
              Bench
            </div>

            ${benchHTML || "<div>No bench players found.</div>"}
          `;

          teamsContainer.appendChild(teamDiv);
        });

      } catch (error) {
        console.error(error);

        status.innerHTML =
          `<strong>Connection failed.</strong><br>
          ${error.message}`;
      }
    }

    loadSleeperData();
  </script>

</body>
</html>
